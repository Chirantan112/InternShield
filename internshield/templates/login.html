{% extends "base.html" %}
{% block title %}Log in · InternShield{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <p class="text-primary fw-semibold text-uppercase small mb-2">Welcome back</p>
        <h1 class="h3 mb-2">Log in to InternShield</h1>
        <p class="text-secondary mb-4">Access your offer checks and reports securely.</p>
        <form method="post" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input class="form-control" id="email" name="email" type="email"
                   autocomplete="email" maxlength="255" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input class="form-control" id="password" name="password" type="password"
                   autocomplete="current-password" required>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" id="remember" name="remember" type="checkbox">
            <label class="form-check-label" for="remember">Remember me on this device</label>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="text-center text-secondary mt-4 mb-0">
          New to InternShield? <a href="{{ url_for('auth.register') }}">Create a student account</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
