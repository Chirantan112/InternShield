{% extends "base.html" %}
{% block title %}Verify email · InternShield{% endblock %}
{% block content %}
<div class="row justify-content-center auth-layout">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card auth-card border-0">
      <div class="card-body p-4 p-lg-5">
        <div class="auth-orb"><i class="bi bi-envelope-check-fill"></i></div>
        <p class="text-primary text-uppercase small fw-bold mb-2">One last step</p>
        <h1 class="h3 mb-2">Verify your email</h1>
        <p class="text-secondary mb-4">Enter the 6-digit code sent to <strong>{{ email }}</strong>. The code expires after 10 minutes.</p>
        <form method="post" action="{{ url_for('auth.verify_email') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="email" value="{{ email }}">
          <div class="mb-4">
            <label for="otp" class="form-label">Verification code</label>
            <input class="form-control form-control-lg text-center" id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" minlength="6" placeholder="000000" required autofocus>
          </div>
          <button class="btn btn-primary w-100" type="submit">Verify email <i class="bi bi-arrow-right ms-1"></i></button>
        </form>
        <form method="post" action="{{ url_for('auth.resend_verification') }}" class="mt-3">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="email" value="{{ email }}">
          <button class="btn btn-outline-secondary w-100" type="submit">Resend code</button>
        </form>
        <p class="text-center text-secondary mt-4 mb-0 small"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
