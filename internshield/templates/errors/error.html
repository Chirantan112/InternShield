{% extends "base.html" %}
{% block title %}{{ code }} · InternShield{% endblock %}
{% block content %}
<div class="row justify-content-center py-5"><div class="col-lg-7 text-center">
  <div class="auth-orb mx-auto mb-3"><i class="bi bi-exclamation-triangle"></i></div>
  <p class="section-label mb-2">Request could not be completed</p>
  <h1 class="display-6 mb-3">{{ code }}</h1>
  <p class="text-secondary mb-4">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Return to InternShield</a>
</div></div>
{% endblock %}
