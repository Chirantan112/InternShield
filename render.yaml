services:
  - type: web
    name: internshield
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.seed_data && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /login
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_NAME
        value: InternShield Administrator
